<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>護理部每日業務回報建立器 V6 Beta 2.0 Preview HIS 訊息格式－I班收案追蹤精簡</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#dbe3e8;--primary:#287a67;--primary2:#e7f4ef;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:15px 18px}h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px;max-width:1480px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 20px rgba(15,23,42,.04)}
h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:78px}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.hidden{display:none!important}
.item,.business-card,.clinic-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fbfcfd}.item-head,.business-title,.clinic-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.item-title,.business-title,.clinic-title{font-weight:800}.mode{display:flex;gap:10px;flex-wrap:wrap}.mode label{display:flex;align-items:center;gap:5px;margin:0;font-weight:600}.mode input{width:auto}.fields{margin-top:12px}.rows{display:flex;flex-direction:column;gap:10px}.row-card{position:relative;border:1px dashed #b8c7cf;border-radius:12px;padding:10px;background:#fff}.row-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.remove,.remove-day-row{position:absolute;right:8px;top:8px;border:0;background:#fff0f0;color:var(--danger);padding:5px 8px;border-radius:8px;cursor:pointer}.remove-business,.remove-clinic{border:1px solid #fecaca;background:#fff0f0;color:var(--danger);padding:7px 10px;border-radius:9px;cursor:pointer;font-weight:800}
.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800}.btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:var(--primary2);color:var(--primary)}.btn-light{background:#eef2f5;color:#334155}.btn-danger{background:#fff0f0;color:var(--danger)}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.preview-wrap{position:sticky;top:18px;height:max-content}.preview{white-space:pre-wrap;background:#111827;color:#f8fafc;border-radius:14px;padding:16px;min-height:420px;max-height:72vh;overflow:auto;line-height:1.65;font-size:14px}.status{font-size:13px;color:var(--muted);margin-top:8px}.note{font-size:12px;color:var(--muted);margin-top:6px}.type-group{margin-top:14px}.type-group:first-child{margin-top:0}.type-group-title{font-size:14px;font-weight:850;color:#475569;margin:0 0 8px;padding-left:2px}.type-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.type-btn{border:1px solid var(--line);background:#fff;padding:12px;border-radius:12px;cursor:pointer;font-weight:800}.type-btn.active{border-color:var(--primary);background:var(--primary2);color:var(--primary)}.management-label{font-size:13px;font-weight:800;color:#64748b;margin:20px 2px 7px}.staff-tools{margin-top:0!important;background:#f8fafc!important;border-color:#e2e8f0!important}.staff-tools summary{font-size:14px;color:#64748b!important;padding:11px 14px!important}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px 12px 105px}.grid,.row-grid,.type-buttons{grid-template-columns:1fr}.preview-wrap{display:none}.preview{min-height:260px;max-height:none}header{text-align:center;position:sticky;top:0;z-index:20;padding:12px}header p{display:none}}
.biz-picker-row{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fbfcfd}.biz-picker-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.biz-warning{margin-top:10px;color:var(--danger);font-size:13px;font-weight:700}.mobile-action-bar{display:none}.preview-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:100;padding:18px;align-items:flex-end}.preview-modal.open{display:flex}.preview-dialog{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 16px 16px;padding:16px}.preview-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.preview-dialog-head h2{margin:0}.modal-preview{min-height:280px;max-height:58vh}.mobile-action-bar button{min-height:54px;font-size:17px}.mobile-action-bar .btn{flex:1}
@media(max-width:900px){.mobile-action-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(15,23,42,.08)}.biz-picker-head{grid-template-columns:minmax(0,1fr) auto}.remove-business{white-space:nowrap}}
.staff-tools{border:1px solid var(--line);border-radius:14px;margin-top:16px;background:#fbfcfd}.staff-tools summary{cursor:pointer;padding:14px 16px;font-weight:800;color:#334155;list-style:none}.staff-tools summary::-webkit-details-marker{display:none}.staff-tools summary::after{content:"＋";float:right}.staff-tools[open] summary::after{content:"－"}.staff-tools-body{border-top:1px solid var(--line);padding:0 16px 16px}.check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check-card{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:10px;border-radius:10px}.check-card input{width:auto}.subcard{border:1px dashed #b8c7cf;border-radius:12px;padding:10px;margin-top:10px;background:#fff}.wide-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:900px){.check-grid,.wide-row{grid-template-columns:1fr}}
/* V6 Beta 1：智慧縮合、填寫狀態與日期快捷 */
.smart-accordion{border:1px solid var(--line);border-radius:14px;margin-top:14px;background:#fff;overflow:hidden}
.smart-accordion>summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:850;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f8fafc}
.smart-accordion>summary::-webkit-details-marker{display:none}.smart-accordion>summary::before{content:"▶";font-size:12px;color:var(--muted);transition:transform .18s ease}.smart-accordion[open]>summary::before{transform:rotate(90deg)}
.smart-accordion-body{padding:0 14px 14px;border-top:1px solid var(--line)}.accordion-title{flex:1}.accordion-count{font-size:12px;color:var(--muted);white-space:nowrap}
.biz-status{display:inline-flex;align-items:center;justify-content:center;min-width:74px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}.biz-status.pending{background:#fff7d6;color:#8a5a00;border:1px solid #f3d676}.biz-status.complete{background:#e7f7ee;color:#176b45;border:1px solid #a7dfc1}.biz-status.unselected{background:#eef2f5;color:#64748b;border:1px solid #dbe3e8}
.biz-picker-head{grid-template-columns:minmax(0,1fr) auto auto}.biz-completion-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f8fafc;color:var(--muted);font-size:13px;font-weight:700}.biz-completion-note.has-pending{background:#fff8e1;color:#875d00;border:1px solid #f4d77b}
.clinic-card.smart-clinic{padding:0;overflow:hidden}.clinic-card.smart-clinic>summary{cursor:pointer;list-style:none;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:850;background:#f8fafc}.clinic-card.smart-clinic>summary::-webkit-details-marker{display:none}.clinic-card.smart-clinic>summary::before{content:"▶";font-size:12px;color:var(--muted);transition:transform .18s ease}.clinic-card.smart-clinic[open]>summary::before{transform:rotate(90deg)}.clinic-card-body{padding:12px;border-top:1px solid var(--line)}.clinic-summary-name{flex:1}.clinic-summary-count{font-size:12px;color:var(--muted)}
@media(max-width:900px){.biz-picker-head{grid-template-columns:minmax(0,1fr) auto}.biz-status{grid-column:1/-1;justify-self:start}.smart-accordion>summary{padding:13px 12px}}

/* V6 Beta 1 日期快捷 */
.date-input-row{display:flex;align-items:center;gap:7px}.date-input-row>input{flex:1;min-width:0}.today-shortcut{border:1px solid #a7d8c9;background:#edf8f4;color:var(--primary);border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:850;white-space:nowrap;line-height:1}.today-shortcut:hover{background:#dff2eb}.today-pair-row{position:relative}.today-pair-row>.today-shortcut{margin-top:8px}
@media(max-width:900px){.today-shortcut{min-height:38px;padding:8px 12px}}
/* V6 Beta 1.3：A／B／D 回報專區切換 */
.report-zone-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.report-zone-btn{border:1px solid var(--line);background:#fff;padding:13px 10px;border-radius:12px;cursor:pointer;font-weight:850}.report-zone-btn.active{border-color:var(--primary);background:var(--primary2);color:var(--primary)}.zone-followup{margin-top:16px;padding:14px;border:1px dashed #aac8bd;border-radius:13px;background:#f6fbf9}.zone-followup .mode{margin-top:8px}.report-zone-panel.hidden{display:none!important}@media(max-width:600px){.report-zone-nav{grid-template-columns:1fr}}

/* V6 Beta 2.0 Preview：緊湊版面與群組業務 */
.group-biz{display:flex;flex-direction:column;gap:8px}.group-biz .subcard{margin-top:0}.group-row{display:grid;grid-template-columns:110px repeat(5,minmax(72px,1fr));gap:7px;align-items:end}.group-row.eye{grid-template-columns:110px repeat(6,minmax(70px,1fr))}.group-row.mj{grid-template-columns:110px minmax(90px,1fr)}.group-name{font-weight:850;padding-bottom:10px}.compact-check{display:flex;align-items:center;gap:6px;margin:0}.compact-check input{width:auto}.section{margin-top:12px;padding-top:12px}.item,.business-card,.clinic-card{margin:7px 0}.subcard{margin-top:7px}.preview{line-height:1.48}
@media(max-width:900px){.group-row,.group-row.eye,.group-row.mj{grid-template-columns:1fr 1fr}.group-name{grid-column:1/-1;padding-bottom:0}}

/* 下班時段提醒：獨立提示層，不影響原有表單介面與邏輯 */
.offhours-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.58);padding:20px;align-items:center;justify-content:center}
.offhours-overlay.open{display:flex}
.offhours-dialog{width:min(460px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 50px rgba(15,23,42,.25);text-align:center}
.offhours-message{font-size:18px;font-weight:850;line-height:1.7;margin:0 0 18px;color:#1f2937}
.offhours-dialog .btn{min-width:160px}
</style></head>
<body><div id="offhoursOverlay" class="offhours-overlay" role="dialog" aria-modal="true" aria-labelledby="offhoursMessage">
  <div class="offhours-dialog">
    <p id="offhoursMessage" class="offhours-message">【現在為下班時段，工作訊息請於上班時段進行】</p>
    <button type="button" class="btn btn-primary" id="offhoursContinue">確定仍要填寫</button>
  </div>
</div>
<header><h1>護理部每日業務回報建立器</h1><p>交班、追蹤、行政回報整合工具｜資料僅保存在目前瀏覽器</p></header>
<main class="app"><section class="panel"><h2>選擇建立種類</h2><div id="typeButtons"></div><div id="formRoot" class="section"></div><div class="management-label">管理功能</div><details class="staff-tools" id="staffTools"><summary id="staffSummary">【後台維護人員專區】 🔒</summary><div class="staff-tools-body"><div class="item-head"><div><b id="staffState">後台維護人員專區（已登入）</b><div class="note">此區包含可載入舊內容的功能，使用後請逐項重新確認。</div></div><button class="btn btn-light" id="staffLogout">登出</button></div><div class="btn-row"><button class="btn btn-light" id="saveDraft">儲存草稿</button><button class="btn btn-light" id="loadDraft">載入草稿</button><button class="btn btn-light" id="saveTemplate">儲存為範本</button><button class="btn btn-light" id="openTemplates">範本管理</button><button class="btn btn-light" id="saveHistory">儲存交班</button><button class="btn btn-light" id="openHistory">交班歷史</button><button class="btn btn-light" id="exportJson">匯出 JSON</button><label class="btn btn-light" style="display:inline-flex;align-items:center;margin:0">匯入 JSON<input id="importJson" type="file" accept="application/json,.json" style="display:none"></label><button class="btn btn-danger" id="clearAll">新交班／清除表單</button></div><div id="status" class="status">一般使用模式不會自動儲存或載入草稿。</div><div id="managerPanel" class="section hidden"></div><div class="section"><h2>系統資訊</h2><p class="note">版本：V6 Beta 2.0 Preview<br>更新日期：2026/07/24<br>本版調整：一般使用模式不再自動儲存、載入或提示舊草稿；僅後台維護人員登入後可使用草稿、範本、歷史與 JSON 功能；其餘既有修正維持不變。</p><button class="btn btn-light" id="copyVersion">📋 複製版本資訊</button></div></div></details></section>
<aside class="panel preview-wrap"><h2>LINE 訊息即時預覽</h2><div id="preview" class="preview"></div><div class="btn-row"><button class="btn btn-primary" id="copyBtn">📋 複製 LINE 訊息</button><button class="btn btn-light" id="copyClearBtn">複製後清除</button></div></aside></main>
<div class="mobile-action-bar"><button class="btn btn-light" id="mobilePreviewBtn">👁 預覽訊息</button><button class="btn btn-primary" id="mobileCopyBtn">📋 複製 LINE 訊息</button></div>
<div class="preview-modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle"><div class="preview-dialog"><div class="preview-dialog-head"><h2 id="previewModalTitle">LINE 訊息預覽</h2><button class="btn btn-light" id="closePreviewModal">關閉</button></div><div id="modalPreview" class="preview modal-preview"></div><div class="btn-row"><button class="btn btn-primary" id="modalCopyBtn">📋 複製</button><button class="btn btn-light" id="modalCopyClearBtn">複製後清除</button></div></div></div>
<script>

const clinics=['北葉晨心','三和晨安','龍泉晨安','繁華晨安','長治晨安','里港晨安','鹽埔晨安','俊鴻皮膚','安心俊鴻','善化中山','善化晨安'];
const circ=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳','㉑','㉒','㉓','㉔','㉕','㉖','㉗','㉘','㉙','㉚','㉛','㉜','㉝','㉞','㉟','㊱','㊲','㊳','㊴','㊵','㊶','㊷','㊸','㊹','㊺','㊻','㊼','㊽','㊾','㊿'];
const types=[['clinic','🏥 院所交班回報專區'],['biz','📋 個人業務回報專區'],['I','📋 CDE回報專區'],['weekly','📅 每週電腦／醫師班表更新'],['monthly','📊 月底回報(採檢/病歷銷毀/3F/DATAlog)'],['password','🔑 預防保健密碼更新'],['audit','🗂️ 抽審資料整理進度']];
const typeGroups=[['每日工作',['clinic','biz','I']],['其他功能',['weekly','monthly','password','audit']]];
let current='clinic';
let abdZone='clinic'; // 從院所交班進入後，目前顯示的專區
let abdIncludeBiz=false; // 從院所交班接續加入個人業務
const commonBiz={
'欠卡追蹤':'contact','外傷照片歸檔':'dateShift','方鼎輸入、核對及EXCEL建檔':'dateCount','預防保健電訪':'contact','預防保健輸入':'twoStage','未看報告追蹤':'contact','身心科預約':'contactSecond','慢病預約名單':'pulledDate','慢病預約反黃':'dateShift','連處回填':'dateShift','慢病預約電訪':'dateContactSecond','慢病未回':'dayContact','急性追蹤':'contact','抽血異常追蹤':'contact','轉診追蹤':'contact','病例歸檔':'fileCount'};
const iBiz={
'收案衛教':'intakeGroup','結案電訪':'closureGroup','電訪追蹤':'followupGroup','療程核對':'dateOnly','業務報表':'doneYearMonth','他院VPN查詢':'vpn','慢病預約反黃':'dateShift','慢病預約名單':'pulledDate','慢病預約電訪':'dateContactSecond','慢病未回':'dayContact','長期未回':'contactSecond'};
function taipeiParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'';return {year:Number(get('year')),month:Number(get('month')),day:Number(get('day'))}}
function today(){const d=taipeiParts();return `${d.year}-${String(d.month).padStart(2,'0')}-${String(d.day).padStart(2,'0')}`}
function clinicOptions(){return clinics.map(x=>`<option>${x}</option>`).join('')}
function baseFields(){return `<div class="grid"><div><label>日期</label><input type="date" data-role="date" value="${today()}"></div><div><label>院所</label><select data-role="clinic">${clinicOptions()}</select></div></div>`}
function renderTypeButtons(){const labels=Object.fromEntries(types);typeButtons.innerHTML=typeGroups.map(([title,ids])=>`<div class="type-group"><div class="type-group-title">${title}</div><div class="type-buttons">${ids.map(id=>`<button class="type-btn ${id===current?'active':''}" data-type="${id}">${labels[id]}</button>`).join('')}</div></div>`).join('')}
function mode(name,none='無',data='填寫'){return `<div class="mode"><label><input type="radio" name="${name}" value="none" checked>${none}</label><label><input type="radio" name="${name}" value="data">${data}</label></div>`}
function repeatCard(id,title,fields){return `<div class="item" data-kind="repeat" data-id="${id}"><div class="item-head"><div class="item-title">【${title}】</div>${mode(id+'Mode')}</div><div class="fields hidden" id="${id}Fields"><div class="rows"></div><button class="btn btn-secondary add-repeat" data-id="${id}">＋ 新增一筆</button></div></div>`}
function simpleCard(id,title,body){return `<div class="item" data-id="${id}"><div class="item-head"><div class="item-title">【${title}】</div>${mode(id+'Mode')}</div><div class="fields hidden" id="${id}Fields">${body}</div></div>`}
function zoneFollowup(kind){if(kind==='clinic')return `<div class="zone-followup"><b>是否接續增加個人業務回報？</b><div class="mode"><label><input type="radio" name="continueBiz" value="no" ${!abdIncludeBiz?'checked':''}>否</label><label><input type="radio" name="continueBiz" value="yes" ${abdIncludeBiz?'checked':''}>是</label></div></div>`;return `<div class="zone-followup"><b>是否回院所交班更改？</b><div class="mode"><label><input type="radio" name="backClinic" value="no" checked>否</label><label><input type="radio" name="backClinic" value="yes">是</label></div></div>`}
function renderClinicHandover(){formRoot.innerHTML=`<h2>${abdZone==='clinic'?'院所交班回報專區':'個人業務回報專區'}</h2><h2>基本資料</h2>${baseFields()}<div id="abdClinicPanel" class="report-zone-panel ${abdZone==='clinic'?'':'hidden'}"><div id="aClinicAccordion">
${repeatCard('labs','未完成採檢',[['mrn','病歷號'],['name','姓名'],['missing','缺少項目']])}
${repeatCard('records','病歷申請',[['mrn','病歷號'],['name','姓名'],['request','申請項目'],['progress','當前進度']])}

<div class="item" data-id="repair"><div class="item-head"><div class="item-title">【待修物品】</div><div class="mode"><label><input type="radio" name="repairMode" value="none" checked>無</label><label><input type="radio" name="repairMode" value="data">有</label><label><input type="radio" name="repairMode" value="reader">讀卡機</label></div></div><div id="repairFields" class="fields hidden"><div class="rows"></div><button class="btn btn-secondary add-repair">＋ 新增一般待修</button><button class="btn btn-secondary add-reader">＋ 新增讀卡機</button></div></div>
${simpleCard('flu','流感快篩',qtyFields('支'))}${simpleCard('covid','COVID-19 快篩',qtyFields('支'))}
${simpleCard('tamiflu','克流感餘量',stockSimple(['瑞樂沙|支','易剋冒|顆','Tamiflu|顆']))}
${simpleCard('vaccine','疫苗／藥品庫存',vaccineFields())}
${simpleCard('mounjaro','猛健樂（Mounjaro）',mounjaroFields())}
<div id="datalogFields" class="fields hidden"><label>完成月份</label><input type="number" min="1" max="12" data-role="datalogMonth"></div>
</div>${zoneFollowup('clinic')}</div><div id="abdBizPanel" class="report-zone-panel ${abdZone==='biz'?'':'hidden'}">${bizSection(commonBiz)}${zoneFollowup('biz')}</div>`}

function hasMeaningfulBizData(card){
 if(!card?.dataset.name)return false;
 const type=card.dataset.type||'';
 const textInputs=[...card.querySelectorAll('input:not([type=radio]):not([type=checkbox]),textarea')];
 if(textInputs.some(x=>String(x.value??'').trim()!==''))return true;
 if([...card.querySelectorAll('input[type=checkbox]:checked')].length)return true;
 // 「無／有」型項目：只有實際切換為有資料時才算完成；預設無不視為已填。
 const checked=[...card.querySelectorAll('input[type=radio]:checked')];
 if(checked.some(x=>x.value==='data'||x.value==='custom'))return true;
 if(type==='dayContactNoNone'&&card.querySelector('.day-row'))return true;
 return false;
}
function updateBusinessStatuses(){
 document.querySelectorAll('.biz-section').forEach(sec=>{
  const cards=[...sec.querySelectorAll('.business-card')];
  let selected=0,pending=0,complete=0;
  cards.forEach(card=>{
   const badge=card.querySelector('.biz-status');
   if(!card.dataset.name){if(badge){badge.className='biz-status unselected';badge.textContent='未選項目'};return}
   selected++;const done=hasMeaningfulBizData(card);if(done)complete++;else pending++;
   if(badge){badge.className=`biz-status ${done?'complete':'pending'}`;badge.textContent=done?'✓ 已完成':'⚠ 待填寫'}
  });
  const note=sec.querySelector('.biz-completion-note');
  if(note){note.classList.toggle('has-pending',pending>0);note.textContent=!selected?'尚未新增業務項目。':pending?`已選 ${selected} 項，其中 ${pending} 項尚未填寫。`:`已選 ${selected} 項，皆已完成。`}
  const host=sec.closest('.smart-accordion');const count=host?.querySelector('[data-biz-count]');if(count)count.textContent=`已選 ${selected} 項／待填 ${pending} 項`;
  const clinic=sec.closest('.smart-clinic');if(clinic){const cc=clinic.querySelector('.clinic-summary-count');if(cc)cc.textContent=`已選 ${selected} 項／待填 ${pending} 項`;const cn=clinic.querySelector('.clinic-summary-name'),clinicName=val(clinic,'[data-role=clinic]');if(cn)cn.textContent=`🏥 ${clinicName||'院所'}`}
 });

 const abdAllowed=new Set(['外傷照片歸檔','慢病預約反黃','連處回填']);
 const iAllowed=new Set(['慢病預約反黃','療程核對','猛健樂名單']);
 root.querySelectorAll('.business-card').forEach(card=>{
  const name=card.dataset.name||'';
  const isI=!!card.closest('.clinic-card');
  const allowed=isI?iAllowed.has(name):abdAllowed.has(name);
  if(!allowed)return;
  const month=card.querySelector('[data-biz="month"]');
  const day=card.querySelector('[data-biz="day"]');
  const parent=month?.parentElement;
  if(month&&day&&parent?.contains(day))addTodayPairButton(parent,'biz-date');
 });
}
function setInputValue(input,value){if(!input)return;input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))}
function fillTodayFromButton(btn){
 const d=taipeiParts(),p=btn.parentElement,mode=btn.dataset.todayMode;
 if(mode==='date'){setInputValue(p.querySelector('input[type="date"]'),today());return}
 const map={
  'biz-date':['[data-biz="month"]','[data-biz="day"]'],
  'track-date':['[data-biz="trackMonth"]','[data-biz="trackDay"]'],
  'claim-done':['[data-c="m1"]','[data-c="d1"]'],
  'claim-pending':['[data-c="m2"]','[data-c="d2"]']
 };
 if(map[mode]){setInputValue(p.querySelector(map[mode][0]),d.month);setInputValue(p.querySelector(map[mode][1]),d.day);return}
 if(mode==='destroy-month'){setInputValue(p.querySelector('[data-role="destroyYear"]'),d.year-1911);setInputValue(p.querySelector('[data-role="destroyMonth"]'),d.month);return}
 if(mode==='biz-month'){setInputValue(p.querySelector('[data-biz="year"]'),d.year-1911);setInputValue(p.querySelector('[data-biz="month"]'),d.month)}
}
const dateShortcutObserver=new MutationObserver(()=>decorateDateShortcuts());
dateShortcutObserver.observe(formRoot,{childList:true,subtree:true});

function captureState(){
 const controls=[...formRoot.querySelectorAll('input,select,textarea')].map((el,i)=>({i,tag:el.tagName,type:el.type,value:el.value,checked:el.checked,selectedIndex:el.selectedIndex}));
 return {version:6,current,html:formRoot.innerHTML,controls,preview:preview.textContent,savedAt:new Date().toISOString()};
}
function restoreState(state){
 if(!state||!state.html)return false;
 current=['A','B','D'].includes(state.current)?'clinic':(state.current||'clinic');renderTypeButtons();
 // 舊草稿／範本／JSON 若仍使用舊院所名稱，載入時自動轉換為新名稱。
 formRoot.innerHTML=String(state.html).replaceAll('安心銘燦','俊鴻皮膚').replaceAll('方鼎輸入及核對','方鼎輸入、核對及EXCEL建檔');
 const els=[...formRoot.querySelectorAll('input,select,textarea')];
 (state.controls||[]).forEach(x=>{const el=els[x.i];if(!el)return;const migratedValue=x.value==='安心銘燦'?'俊鴻皮膚':(x.value==='方鼎輸入及核對'?'方鼎輸入、核對及EXCEL建檔':(x.value??''));if(el.type==='checkbox'||el.type==='radio')el.checked=!!x.checked;else if(el.tagName==='SELECT'){const option=[...el.options].find(o=>o.value===migratedValue||o.text===migratedValue);if(option)el.value=option.value;else el.selectedIndex=x.selectedIndex}else el.value=migratedValue});
 render();return true;
}
function autoSave(){
 if(!staffLoggedIn())return false;
 try{localStorage.setItem('nursingV6AutoDraft',JSON.stringify(captureState()));status.textContent='後台草稿已自動儲存於此瀏覽器。';return true}
 catch{status.textContent='草稿儲存失敗，可能是瀏覽器儲存空間不足。';return false}
}
let saveTimer;function scheduleAutoSave(){if(!staffLoggedIn())return;clearTimeout(saveTimer);saveTimer=setTimeout(autoSave,250)}
document.addEventListener('input',()=>{render();scheduleAutoSave()});
document.addEventListener('change',scheduleAutoSave);
async function copy(clear){try{await navigator.clipboard.writeText(preview.textContent)}catch{const a=document.createElement('textarea');a.value=preview.textContent;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}status.textContent='已複製，可直接貼到 LINE。';if(clear)setTimeout(()=>{renderForm();autoSave()},200)}
function getList(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}
function setList(key,v){localStorage.setItem(key,JSON.stringify(v))}
function safeName(prefix){const d=new Date(),pad=n=>String(n).padStart(2,'0');return `${prefix}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`}
function showManager(kind){const isHistory=kind==='history',key=isHistory?'nursingV5History':'nursingV5Templates',list=getList(key);managerPanel.classList.remove('hidden');managerPanel.innerHTML=`<div class="item-head"><h2>${isHistory?'交班歷史':'範本管理'}</h2><button class="btn btn-light" id="closeManager">關閉</button></div>${list.length?list.map((x,i)=>`<div class="subcard"><b>${x.name}</b><div class="note">${new Date(x.savedAt).toLocaleString('zh-TW')}</div><div class="btn-row"><button class="btn btn-secondary load-managed" data-kind="${kind}" data-index="${i}">載入</button><button class="btn btn-danger delete-managed" data-kind="${kind}" data-index="${i}">刪除</button></div></div>`).join(''):'<p class="note">目前沒有資料。</p>'}`}

const staffTools=document.getElementById('staffTools'),staffSummary=document.getElementById('staffSummary');
function staffLoggedIn(){return sessionStorage.getItem('nursingV6StaffLoggedIn')==='1'}
function updateStaffLabel(){staffSummary.textContent=staffLoggedIn()?'【後台維護人員專區】（已登入）':'【後台維護人員專區】 🔒'}
staffSummary.addEventListener('click',e=>{if(staffLoggedIn())return;e.preventDefault();const password=prompt('請輸入後台維護人員密碼：');if(password==='ansin'){sessionStorage.setItem('nursingV6StaffLoggedIn','1');updateStaffLabel();staffTools.open=true;status.textContent='已進入後台維護模式，草稿自動儲存已啟用。'}else if(password!==null)alert('密碼不正確。')});
document.getElementById('staffLogout').onclick=()=>{sessionStorage.removeItem('nursingV6StaffLoggedIn');clearTimeout(saveTimer);staffTools.open=false;managerPanel.classList.add('hidden');updateStaffLabel();status.textContent='已登出後台；一般使用模式不會自動儲存或載入草稿。';};
document.getElementById('copyVersion').onclick=async()=>{const text='護理部每日業務回報建立器\nVersion：V6 Beta 1.7\n更新日期：2026/07/24';try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}status.textContent='版本資訊已複製。'};
updateStaffLabel();
copyBtn.onclick=()=>copy(false);copyClearBtn.onclick=()=>copy(true);
const previewModal=document.getElementById('previewModal'),modalPreview=document.getElementById('modalPreview');
function openMobilePreview(){modalPreview.textContent=preview.textContent;previewModal.classList.add('open');document.body.style.overflow='hidden'}
function closeMobilePreview(){previewModal.classList.remove('open');document.body.style.overflow=''}
document.getElementById('mobilePreviewBtn').onclick=openMobilePreview;
document.getElementById('closePreviewModal').onclick=closeMobilePreview;
document.getElementById('mobileCopyBtn').onclick=()=>copy(false);
document.getElementById('modalCopyBtn').onclick=()=>copy(false);
document.getElementById('modalCopyClearBtn').onclick=()=>{copy(true);closeMobilePreview()};
previewModal.addEventListener('click',e=>{if(e.target===previewModal)closeMobilePreview()});
clearAll.onclick=()=>{if(confirm('確定要清除目前表單並建立新交班嗎？')){renderForm();autoSave();status.textContent='已建立新交班。'}};
saveDraft.onclick=()=>{if(autoSave())status.textContent='草稿已儲存。'};
loadDraft.onclick=()=>{try{const s=JSON.parse(localStorage.getItem('nursingV6AutoDraft')||localStorage.getItem('nursingV5AutoDraft')||'null');if(restoreState(s))status.textContent='已載入草稿。';else status.textContent='沒有可載入的草稿。'}catch{status.textContent='草稿格式無法讀取。'}};
saveTemplate.onclick=()=>{const name=prompt('請輸入範本名稱：',`${types.find(x=>x[0]===current)?.[1]||'交班'}範本`);if(!name)return;const a=getList('nursingV5Templates');a.unshift({name,savedAt:new Date().toISOString(),state:captureState()});setList('nursingV5Templates',a.slice(0,30));status.textContent='範本已儲存。'};
openTemplates.onclick=()=>showManager('template');
saveHistory.onclick=()=>{const name=prompt('請輸入這筆交班名稱：',safeName(types.find(x=>x[0]===current)?.[1]||'交班'));if(!name)return;const a=getList('nursingV5History');a.unshift({name,savedAt:new Date().toISOString(),state:captureState(),message:preview.textContent});setList('nursingV5History',a.slice(0,100));status.textContent='交班紀錄已儲存。'};
openHistory.onclick=()=>showManager('history');
managerPanel.addEventListener('click',e=>{if(e.target.id==='closeManager')managerPanel.classList.add('hidden');if(e.target.matches('.load-managed')){const key=e.target.dataset.kind==='history'?'nursingV5History':'nursingV5Templates',a=getList(key),x=a[Number(e.target.dataset.index)];if(x&&restoreState(x.state)){managerPanel.classList.add('hidden');autoSave();status.textContent='已載入。'}}if(e.target.matches('.delete-managed')){const key=e.target.dataset.kind==='history'?'nursingV5History':'nursingV5Templates',a=getList(key);a.splice(Number(e.target.dataset.index),1);setList(key,a);showManager(e.target.dataset.kind)}});
exportJson.onclick=()=>{const blob=new Blob([JSON.stringify({app:'nursing-line-builder',version:6,state:captureState()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeName('護理交班')+'.json';a.click();URL.revokeObjectURL(a.href);status.textContent='JSON 已匯出。'};
importJson.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),st=data.state||data;if(!restoreState(st))throw new Error();autoSave();status.textContent='JSON 已匯入。'}catch{alert('無法匯入：檔案格式不正確。')}e.target.value=''};
// 清除舊版曾永久保留的後台登入狀態，避免共用電腦下次開啟時直接進入後台。
try{localStorage.removeItem('nursingV5StaffLoggedIn')}catch{}
renderForm();


// 下班時段提醒：以台灣時間判斷，每次載入頁面只檢查一次。
(function initOffhoursNotice(){
  try{
    const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const hour=Number(parts.find(p=>p.type==='hour')?.value);
    const minute=Number(parts.find(p=>p.type==='minute')?.value);
    const totalMinutes=hour*60+minute;
    const isOffhours=totalMinutes>=20*60+30 || totalMinutes<8*60;
    if(!isOffhours)return;
    const overlay=document.getElementById('offhoursOverlay');
    const continueBtn=document.getElementById('offhoursContinue');
    if(!overlay||!continueBtn)return;
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
    continueBtn.focus();
    continueBtn.addEventListener('click',()=>{
      overlay.classList.remove('open');
      document.body.style.overflow='';
    },{once:true});
  }catch(e){
    // 若時間判斷不可用，維持原系統正常進入，不阻擋既有功能。
  }
})();
